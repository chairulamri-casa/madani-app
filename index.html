function useChart(canvasRef, config, deps) {
  useEffect(() => {
    if (!canvasRef.current) return;
    const chart = new Chart(canvasRef.current, config);
    return () => chart.destroy();
    // eslint-disable-next-line
  }, deps);
}

function TrenAnalitikPanel({ sesiAll, responAll, madrasahList, checklists, rekapStatus }) {
  const [periodeList, setPeriodeList] = useState([]);
  const [loading, setLoading] = useState(true);
  const trenRef = useRef(null);
  const statusRef = useRef(null);
  const negeriSwastaRef = useRef(null);

  useEffect(() => {
    (async () => {
      const { data } = await sb.from("madani_periode_survei").select("*").order("tanggal_mulai");
      setPeriodeList(data || []);
      setLoading(false);
    })();
  }, []);

  const trenData = useMemo(() => {
    return periodeList.map(p => {
      const sesiIds = sesiAll.filter(s => s.periode_survei_id === p.id).map(s => s.id);
      const rs = responAll.filter(r => sesiIds.includes(r.sesi_id));
      const totalYa = rs.reduce((a,r)=>a+[r.q1,r.q2,r.q3,r.q4,r.q5,r.q6,r.q7,r.q8].filter(Boolean).length,0);
      const pct = rs.length > 0 ? (totalYa/(rs.length*8))*100 : null;
      return { label: p.nama, pct, n: rs.length };
    });
  }, [periodeList, sesiAll, responAll]);

  const statusData = useMemo(() => {
    const ids = madrasahList.map(m => m.id);
    const cks = checklists.filter(c => ids.includes(c.madrasah_id));
    const statuses = cks.map(statusFromChecklist);
    const lengkap = statuses.filter(s=>s==="Lengkap").length;
    const sebagian = statuses.filter(s=>s==="Sebagian").length;
    const belum = madrasahList.length - cks.length + statuses.filter(s=>s==="Belum Dimulai").length;
    return { lengkap, sebagian, belum };
  }, [madrasahList, checklists]);

  useChart(trenRef, {
    type: "line",
    data: {
      labels: trenData.map(d => d.label),
      datasets: [{
        label: "% Siswa Merasa Aman",
        data: trenData.map(d => d.pct),
        borderColor: "#0f5132", backgroundColor: "rgba(15,81,50,0.12)",
        tension: 0.25, fill: true, spanGaps: true,
      }],
    },
    options: { responsive: true, scales: { y: { min: 0, max: 100, ticks: { callback: v => v + "%" } } }, plugins: { legend: { display: false } } },
  }, [trenData]);

  useChart(statusRef, {
    type: "doughnut",
    data: {
      labels: ["Lengkap", "Sebagian", "Belum Dimulai"],
      datasets: [{ data: [statusData.lengkap, statusData.sebagian, statusData.belum], backgroundColor: ["#0f5132", "#d4a017", "#b3261e"] }],
    },
    options: { responsive: true, plugins: { legend: { position: "bottom" } } },
  }, [statusData]);

  useChart(negeriSwastaRef, {
    type: "bar",
    data: {
      labels: ["Negeri", "Swasta"],
      datasets: [
        { label: "Lengkap", data: rekapStatus.map(r=>r.lengkap), backgroundColor: "#0f5132" },
        { label: "Sebagian", data: rekapStatus.map(r=>r.sebagian), backgroundColor: "#d4a017" },
        { label: "Belum", data: rekapStatus.map(r=>r.belum), backgroundColor: "#b3261e" },
      ],
    },
    options: { responsive: true, scales: { x: { stacked: true }, y: { stacked: true } } },
  }, [rekapStatus]);

  if (loading) return <div className="card">Memuat data tren...</div>;

  return (
    <div>
      <div className="card">
        <h2>Tren % Rasa Aman Antar Periode</h2>
        {periodeList.length === 0 ? (
          <p className="small-muted">Belum ada periode survei dibuat. Buka periode dulu di tab "Periode Survei" supaya data bisa dikelompokkan per semester.</p>
        ) : (
          <div style={{maxWidth:700}}><canvas ref={trenRef}></canvas></div>
        )}
      </div>
      <div className="grid2">
        <div className="card">
          <h2>Status Implementasi Keseluruhan</h2>
          <div style={{maxWidth:320,margin:"0 auto"}}><canvas ref={statusRef}></canvas></div>
        </div>
        <div className="card">
          <h2>Negeri vs Swasta</h2>
          <canvas ref={negeriSwastaRef}></canvas>
        </div>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------
// ADMIN: LAPORAN EKSEKUTIF (PDF siap cetak/tanda tangan)
// ---------------------------------------------------------------------
function LaporanEksekutifPanel({ totals, rekapKabKota, rekapStatus }) {
  const [generating, setGenerating] = useState(false);

  function generatePdf() {
    setGenerating(true);
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "mm", format: "a4" });
    const today = new Date().toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric" });

    doc.setFont("helvetica", "bold");
    doc.setFontSize(13);
    doc.text("KEMENTERIAN AGAMA REPUBLIK INDONESIA", 105, 15, { align: "center" });
    doc.text("KANTOR WILAYAH PROVINSI ACEH", 105, 21, { align: "center" });
    doc.setFontSize(11);
    doc.text("BIDANG PENDIDIKAN MADRASAH", 105, 27, { align: "center" });
    doc.setLineWidth(0.5);
    doc.line(15, 31, 195, 31);

    doc.setFont("helvetica", "bold");
    doc.setFontSize(12);
    doc.text("LAPORAN REKAPITULASI IMPLEMENTASI", 105, 40, { align: "center" });
    doc.text("Madrasah sebagai Ruang Pendidikan yang Aman, Ramah, Inklusif, dan Penuh Kasih", 105, 46, { align: "center", maxWidth: 170 });
    doc.setFont("helvetica", "normal");
    doc.setFontSize(9);
    doc.text("Berdasarkan SE Dirjen Pendidikan Islam No. B-81/Dt.I.II/KP.02/09/2026 — dicetak melalui aplikasi MADANI", 105, 53, { align: "center" });
    doc.text("Tanggal cetak: " + today, 105, 58, { align: "center" });

    doc.setFont("helvetica", "bold");
    doc.setFontSize(10);
    doc.text("Ringkasan Provinsi Aceh", 15, 68);

    doc.autoTable({
      startY: 72,
      head: [["Indikator", "Jumlah"]],
      body: [
        ["Total Madrasah Terdaftar", String(totals.jumlahMadrasah)],
        ["Sudah Sosialisasi SE", String(totals.sosialisasi)],
        ["Status Implementasi: Lengkap", String(totals.lengkap)],
        ["Status Implementasi: Sebagian", String(totals.sebagian)],
        ["Status Implementasi: Belum Dimulai", String(totals.belum)],
        ["Total Kasus Tercatat", String(totals.totalKasus) + " (selesai: " + totals.kasusSelesai + ")"],
      ],
      theme: "grid",
      headStyles: { fillColor: [15, 81, 50] },
      styles: { fontSize: 9 },
      margin: { left: 15, right: 15 },
    });

    let y = doc.lastAutoTable.finalY + 10;
    doc.setFont("helvetica", "bold");
    doc.setFontSize(10);
    doc.text("Rekapitulasi per Kabupaten/Kota", 15, y);

    doc.autoTable({
      startY: y + 4,
      head: [["Kab/Kota", "Madrasah", "Sosialisasi", "TPPK", "Lengkap", "Sebagian", "Belum", "% Aman", "Kasus"]],
      body: rekapKabKota.map(r => [
        r.kab, String(r.jumlahMadrasah), `${r.sosialisasi}/${r.jumlahMadrasah}`, `${r.tppk}/${r.jumlahMadrasah}`,
        String(r.lengkap), String(r.sebagian), String(r.belum),
        r.pctAman === "-" ? "-" : r.pctAman + "%", `${r.kasusSelesai}/${r.totalKasus}`,
      ]),
      theme: "grid",
      headStyles: { fillColor: [15, 81, 50] },
      styles: { fontSize: 7.5 },
      margin: { left: 15, right: 15 },
    });

    y = doc.lastAutoTable.finalY + 10;
    if (y > 250) { doc.addPage(); y = 20; }
    doc.setFont("helvetica", "bold");
    doc.setFontSize(10);
    doc.text("Perbandingan Negeri vs Swasta", 15, y);
    doc.autoTable({
      startY: y + 4,
      head: [["Status", "Jumlah", "Lengkap", "Sebagian", "Belum", "% Aman", "Kasus"]],
      body: rekapStatus.map(r => [r.status, String(r.jumlah), String(r.lengkap), String(r.sebagian), String(r.belum), r.pctAman === "-" ? "-" : r.pctAman + "%", String(r.totalKasus)]),
      theme: "grid",
      headStyles: { fillColor: [15, 81, 50] },
      styles: { fontSize: 8.5 },
      margin: { left: 15, right: 15 },
    });

    y = doc.lastAutoTable.finalY + 25;
    if (y > 260) { doc.addPage(); y = 30; }
    doc.setFont("helvetica", "normal");
    doc.setFontSize(9);
    doc.text("Kepala Bidang Pendidikan Madrasah,", 130, y);
    doc.text("_____________________________", 130, y + 25);
    doc.text("NIP.", 130, y + 30);

    doc.save(`Laporan_MADANI_${new Date().toISOString().slice(0,10)}.pdf`);
    setGenerating(false);
  }

  return (
    <div className="card">
      <h2>Laporan Eksekutif</h2>
      <p className="small-muted">Ringkasan rekap SELURUH PROVINSI saat ini (data langsung dari database, bukan snapshot lama), diformat siap cetak dan diajukan untuk tanda tangan Kabid.</p>
      <button className="btn" onClick={generatePdf} disabled={generating}>{generating ? "Membuat PDF..." : "⬇ Unduh Laporan PDF"}</button>
    </div>
  );
}

// ---------------------------------------------------------------------
// ADMIN KANWIL DASHBOARD
// ---------------------------------------------------------------------
function AdminDashboard() {
  const [tab, setTab] = useState("rekap");
  const [loading, setLoading] = useState(true);
  const [madrasahList, setMadrasahList] = useState([]);
  const [guruList, setGuruList] = useState([]);
  const [checklists, setChecklists] = useState([]);
  const [sesiAll, setSesiAll] = useState([]);
  const [responAll, setResponAll] = useState([]);
  const [kasusAll, setKasusAll] = useState([]);
  const [pengaduanAll, setPengaduanAll] = useState([]);
  const [filterKab, setFilterKab] = useState("Semua");

  const loadAll = useCallback(async () => {
    setLoading(true);
    const [{data:m},{data:g},{data:c},{data:sesi},{data:k},{data:pp}] = await Promise.all([
      sb.from("madani_madrasah").select("*").order("nama"),
      sb.from("madani_guru").select("*, madani_madrasah(nama)").order("nama"),
      sb.from("madani_checklist").select("*"),
      sb.from("madani_survei_sesi").select("*"),
      sb.from("madani_kasus").select("*"),
      sb.from("madani_pengaduan_publik").select("*"),
    ]);
    setMadrasahList(m||[]); setGuruList(g||[]); setChecklists(c||[]); setSesiAll(sesi||[]); setKasusAll(k||[]); setPengaduanAll(pp||[]);
    if (sesi && sesi.length) {
      const { data: respon } = await sb.from("madani_survei_respon").select("*").in("sesi_id", sesi.map(s=>s.id));
      setResponAll(respon || []);
    } else {
      setResponAll([]);
    }
    setLoading(false);
  }, []);

  useEffect(() => { loadAll(); }, [loadAll]);

  const rekapKabKota = useMemo(() => {
    return KABKOTA_ACEH.map(kk => {
      const mds = madrasahList.filter(m => m.kab_kota === kk);
      const ids = mds.map(m => m.id);
      const cks = checklists.filter(c => ids.includes(c.madrasah_id));
      const statuses = cks.map(statusFromChecklist);
      const lengkap = statuses.filter(s=>s==="Lengkap").length;
      const sebagian = statuses.filter(s=>s==="Sebagian").length;
      const belum = mds.length - cks.length + statuses.filter(s=>s==="Belum Dimulai").length;
      const sesiIds = sesiAll.filter(s => ids.includes(s.madrasah_id)).map(s => s.id);
      const rs = responAll.filter(r => sesiIds.includes(r.sesi_id));
      const totalSiswa = rs.length;
      const totalYa = rs.reduce((a,r)=>a+[r.q1,r.q2,r.q3,r.q4,r.q5,r.q6,r.q7,r.q8].filter(Boolean).length,0);
      const pctAman = totalSiswa>0 ? ((totalYa/(totalSiswa*8))*100).toFixed(1) : "-";
      const ks = kasusAll.filter(k => ids.includes(k.madrasah_id));
      const pp = pengaduanAll.filter(p => ids.includes(p.madrasah_id));
      return {
        kab: kk, jumlahMadrasah: mds.length, sosialisasi: cks.filter(c=>c.sosialisasi_dilaksanakan).length,
        tppk: cks.filter(c=>c.tppk_dibentuk).length,
        lengkap, sebagian, belum, totalKasus: ks.length, kasusSelesai: ks.filter(x=>x.status==="Selesai").length,
        totalPengaduan: pp.length, pengaduanBaru: pp.filter(x=>x.status==="Baru").length,
        pctAman,
      };
    });
  }, [madrasahList, checklists, sesiAll, responAll, kasusAll, pengaduanAll]);

  const rekapStatus = useMemo(() => {
    return ["Negeri", "Swasta"].map(st => {
      const mds = madrasahList.filter(m => (m.status_madrasah || "Negeri") === st);
      const ids = mds.map(m => m.id);
      const cks = checklists.filter(c => ids.includes(c.madrasah_id));
      const statuses = cks.map(statusFromChecklist);
      const lengkap = statuses.filter(s=>s==="Lengkap").length;
      const sebagian = statuses.filter(s=>s==="Sebagian").length;
      const belum = mds.length - cks.length + statuses.filter(s=>s==="Belum Dimulai").length;
      const sesiIds = sesiAll.filter(s => ids.includes(s.madrasah_id)).map(s => s.id);
      const rs = responAll.filter(r => sesiIds.includes(r.sesi_id));
      const totalYa = rs.reduce((a,r)=>a+[r.q1,r.q2,r.q3,r.q4,r.q5,r.q6,r.q7,r.q8].filter(Boolean).length,0);
      const pctAman = rs.length>0 ? ((totalYa/(rs.length*8))*100).toFixed(1) : "-";
      const ks = kasusAll.filter(k => ids.includes(k.madrasah_id));
      return { status: st, jumlah: mds.length, lengkap, sebagian, belum, pctAman, totalKasus: ks.length };
    });
  }, [madrasahList, checklists, sesiAll, responAll, kasusAll]);

  const totals = useMemo(() => rekapKabKota.reduce((acc,r) => ({
    jumlahMadrasah: acc.jumlahMadrasah + r.jumlahMadrasah,
    sosialisasi: acc.sosialisasi + r.sosialisasi,
    lengkap: acc.lengkap + r.lengkap,
    sebagian: acc.sebagian + r.sebagian,
    belum: acc.belum + r.belum,
    totalKasus: acc.totalKasus + r.totalKasus,
    kasusSelesai: acc.kasusSelesai + r.kasusSelesai,
  }), {jumlahMadrasah:0,sosialisasi:0,lengkap:0,sebagian:0,belum:0,totalKasus:0,kasusSelesai:0}), [rekapKabKota]);

  const displayed = filterKab === "Semua" ? rekapKabKota : rekapKabKota.filter(r=>r.kab===filterKab);

  if (loading) return <div className="card">Memuat rekap seluruh provinsi...</div>;

  return (
    <div>
      <div className="stat-grid">
        <div className="stat-box"><div className="num">{totals.jumlahMadrasah}</div><div className="lbl">Madrasah Terdaftar</div></div>
        <div className="stat-box"><div className="num">{totals.lengkap}</div><div className="lbl">Status Lengkap</div></div>
        <div className="stat-box"><div className="num">{totals.sebagian}</div><div className="lbl">Status Sebagian</div></div>
        <div className="stat-box"><div className="num">{totals.totalKasus}</div><div className="lbl">Total Kasus Tercatat</div></div>
      </div>

      <div className="nav-tabs">
        <button className={tab==="rekap"?"active":""} onClick={()=>setTab("rekap")}>Rekap Kab-Kota</button>
        <button className={tab==="madrasah"?"active":""} onClick={()=>setTab("madrasah")}>Kelola Madrasah</button>
        <button className={tab==="guru"?"active":""} onClick={()=>setTab("guru")}>Kelola Guru/Wali Kelas</button>
        <button className={tab==="periode"?"active":""} onClick={()=>setTab("periode")}>Periode Survei</button>
        <button className={tab==="tren"?"active":""} onClick={()=>setTab("tren")}>Tren & Analitik</button>
        <button className={tab==="laporan"?"active":""} onClick={()=>setTab("laporan")}>Laporan Eksekutif</button>
      </div>

      {tab === "rekap" && (
      <>
      <div className="card">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
          <h2 style={{border:"none",margin:0}}>Rekap per Kabupaten/Kota</h2>
          <select value={filterKab} onChange={e=>setFilterKab(e.target.value)} style={{width:220}}>
            <option>Semua</option>
            {KABKOTA_ACEH.map(k=><option key={k}>{k}</option>)}
          </select>
        </div>
        <div className="table-wrap" style={{marginTop:14}}>
          <table>
            <thead>
              <tr>
                <th>Kab/Kota</th><th>Madrasah</th><th>Sosialisasi</th><th>TPPK Dibentuk</th>
                <th>Lengkap</th><th>Sebagian</th><th>Belum</th>
                <th>% Rasa Aman</th><th>Kasus (Selesai/Total)</th><th>Pengaduan Publik (Baru/Total)</th>
              </tr>
            </thead>
            <tbody>
              {displayed.map(r=>(
                <tr key={r.kab}>
                  <td>{r.kab}</td>
                  <td>{r.jumlahMadrasah}</td>
                  <td>{r.sosialisasi}/{r.jumlahMadrasah}</td>
                  <td>{r.tppk}/{r.jumlahMadrasah}</td>
                  <td><span className="badge ok">{r.lengkap}</span></td>
                  <td><span className="badge warn">{r.sebagian}</span></td>
                  <td><span className="badge danger">{r.belum}</span></td>
                  <td>{r.pctAman === "-" ? "-" : r.pctAman + "%"}</td>
                  <td>{r.kasusSelesai}/{r.totalKasus}</td>
                  <td>{r.pengaduanBaru}/{r.totalPengaduan}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      <div className="card">
        <h2>Perbandingan Negeri vs Swasta</h2>
        <div className="table-wrap">
          <table>
            <thead><tr><th>Status</th><th>Jumlah Madrasah</th><th>Lengkap</th><th>Sebagian</th><th>Belum</th><th>% Rasa Aman</th><th>Total Kasus</th></tr></thead>
            <tbody>
              {rekapStatus.map(r => (
                <tr key={r.status}>
                  <td><span className={"badge " + (r.status === "Swasta" ? "warn" : "neutral")}>{r.status}</span></td>
                  <td>{r.jumlah}</td>
                  <td><span className="badge ok">{r.lengkap}</span></td>
                  <td><span className="badge warn">{r.sebagian}</span></td>
                  <td><span className="badge danger">{r.belum}</span></td>
                  <td>{r.pctAman === "-" ? "-" : r.pctAman + "%"}</td>
                  <td>{r.totalKasus}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
      </>
      )}

      {tab === "madrasah" && <KelolaMadrasahPanel madrasahList={madrasahList} onChanged={loadAll} />}
      {tab === "guru" && <KelolaGuruPanel guruList={guruList} madrasahList={madrasahList} onChanged={loadAll} />}
      {tab === "periode" && <PeriodeSurveiPanel />}
      {tab === "tren" && (
        <TrenAnalitikPanel sesiAll={sesiAll} responAll={responAll} madrasahList={madrasahList} checklists={checklists} rekapStatus={rekapStatus} />
      )}
      {tab === "laporan" && (
        <LaporanEksekutifPanel totals={totals} rekapKabKota={rekapKabKota} rekapStatus={rekapStatus} />
      )}
    </div>
  );
}

// ---------------------------------------------------------------------
// APP ROOT
// ---------------------------------------------------------------------
function App() {
  const [session, setSession] = useState(() => {
    try {
      const saved = localStorage.getItem("madani_session");
      return saved ? JSON.parse(saved) : null;
    } catch {
      return null;
    }
  });

  function handleLogin(newSession) {
    setSession(newSession);
    try { localStorage.setItem("madani_session", JSON.stringify(newSession)); } catch {}
  }
  function handleLogout() {
    setSession(null);
    try { localStorage.removeItem("madani_session"); } catch {}
  }

  const kodeSurvei = useMemo(() => {
    const params = new URLSearchParams(window.location.search);
    return params.get("survei");
  }, []);
  const kodeLapor = useMemo(() => {
    const params = new URLSearchParams(window.location.search);
    return params.get("lapor");
  }, []);

  if (kodeSurvei) return <StudentSurveyView kode={kodeSurvei} />;
  if (kodeLapor) return <PublicComplaintView kode={kodeLapor} />;

  if (!session) return <LoginScreen onLogin={handleLogin} />;

  const roleLabel = { kepala: "Kepala Madrasah", guru: "Wali Kelas", admin: "Admin Kanwil" }[session.role];
  const nameLabel = session.role === "admin" ? session.profile.nama
    : session.role === "guru" ? `${session.profile.nama} (${session.profile.kelas})`
    : session.profile.nama;

  return (
    <div className="app">
      <header className="topbar">
        <div>
          <h1>MADANI</h1>
          <div className="sub">{roleLabel} — {nameLabel}</div>
        </div>
        <button onClick={handleLogout}>Keluar</button>
      </header>
      <main>
        {session.role === "kepala" && <KepalaDashboard profile={session.profile} />}
        {session.role === "guru" && <GuruDashboard profile={session.profile} />}
        {session.role === "admin" && <AdminDashboard />}
      </main>
      <div className="footer-note">MADANI · Bidang Pendidikan Madrasah, Kanwil Kemenag Provinsi Aceh</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {
      // gagal daftar (misal dibuka dari file:// lokal) - abaikan, aplikasi tetap jalan normal
    });
  });
}
